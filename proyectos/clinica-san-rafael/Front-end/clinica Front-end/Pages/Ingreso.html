<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresos</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Asset/css/clinica.css">
</head>

<body class="page-shell">

    <div class="page-header">
        <div>
            <h1><i class='bx bx-bed'></i> Ingresos</h1>
            <p>Asignación de habitación y seguimiento de cada hospitalización.</p>
        </div>
    </div>

    <div class="card-surface">
        <div class="toolbar">
            <button class="btn btn-primary" id="agregarIngresoBtn" data-bs-toggle="modal" data-bs-target="#modalIngreso">
                <i class='bx bx-plus'></i> Registrar ingreso
            </button>
            <div class="search-input">
                <i class='bx bx-search'></i>
                <input type="search" id="searchIngreso" class="form-control" placeholder="Buscar por paciente, médico o habitación...">
            </div>
        </div>

        <div class="table-responsive-clinica">
            <table id="ingresoTable" class="table table-clinica mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Habitación</th>
                        <th>Cama</th>
                        <th>Paciente</th>
                        <th>Médico</th>
                        <th>Ingreso</th>
                        <th>Salida</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalIngreso" tabindex="-1" aria-labelledby="modalIngresoLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalIngresoLabel">Registro de ingreso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="IngresoForm">
                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="room" class="form-label">Habitación</label>
                                <input type="text" id="room" name="room" class="form-control" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="bed" class="form-label">Cama</label>
                                <input type="text" id="bed" name="bed" class="form-control" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="patientId" class="form-label">Paciente</label>
                                <select id="patientId" name="patientId" class="form-select" required>
                                    <option value="">Seleccione un paciente…</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label for="doctorId" class="form-label">Médico</label>
                                <select id="doctorId" name="doctorId" class="form-select" required>
                                    <option value="">Seleccione un médico…</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="admissionDate" class="form-label">Fecha de ingreso</label>
                                <input type="date" id="admissionDate" name="admissionDate" class="form-control" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="dischargeDate" class="form-label">Fecha de salida (opcional)</label>
                                <input type="date" id="dischargeDate" name="dischargeDate" class="form-control">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="status" class="form-label">Estado</label>
                                <select id="status" name="status" class="form-select" required>
                                    <option value="En observacion">En observación</option>
                                    <option value="Alta">Dado de alta</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="guardarIngreso">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../Asset/js/Ingreso.js"></script>
</body>

</html>
