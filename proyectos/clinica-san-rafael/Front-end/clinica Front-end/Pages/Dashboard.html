<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica San Rafael</title>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Asset/css/clinica.css">
</head>

<body>

    <div class="app-shell">
        <aside class="app-sidebar" id="appSidebar">
            <div class="app-brand">
                <span class="app-brand-icon"><i class='bx bxs-plus-medical'></i></span>
                <div class="app-brand-text">
                    <div class="name">Clínica San Rafael</div>
                    <div class="tagline">Sistema de gestión hospitalaria</div>
                </div>
            </div>

            <nav class="app-nav">
                <div class="app-nav-label">General</div>
                <a class="app-nav-link active" href="#" data-src="Home.html">
                    <i class='bx bx-home-alt'></i> Inicio
                </a>

                <div class="app-nav-label">Registros</div>
                <a class="app-nav-link" href="#" data-src="Medico.html">
                    <i class='bx bx-user-voice'></i> Médicos
                </a>
                <a class="app-nav-link" href="#" data-src="Paciente.html">
                    <i class='bx bx-user'></i> Pacientes
                </a>
                <a class="app-nav-link" href="#" data-src="Ingreso.html">
                    <i class='bx bx-bed'></i> Ingresos
                </a>
            </nav>
        </aside>

        <div class="app-main">
            <header class="app-topbar">
                <button class="app-topbar-toggle" id="sidebarToggle" aria-label="Abrir menú">
                    <i class='bx bx-menu'></i>
                </button>
                <span class="app-topbar-title" id="topbarTitle">Inicio</span>
            </header>

            <main class="app-content">
                <div class="app-frame-card">
                    <iframe id="workSpace" name="workSpace" src="Home.html" title="Contenido"></iframe>
                </div>
            </main>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('appSidebar');
        const toggleBtn = document.getElementById('sidebarToggle');
        const links = document.querySelectorAll('.app-nav-link');
        const frame = document.getElementById('workSpace');
        const topbarTitle = document.getElementById('topbarTitle');

        toggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));

        links.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                links.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                frame.src = link.dataset.src;
                topbarTitle.textContent = link.textContent.trim();
                sidebar.classList.remove('open');
            });
        });
    </script>
</body>

</html>
