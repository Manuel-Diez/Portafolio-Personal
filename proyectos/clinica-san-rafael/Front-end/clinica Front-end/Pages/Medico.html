<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médicos</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Asset/css/clinica.css">
</head>

<body class="page-shell">

    <div class="page-header">
        <div>
            <h1><i class='bx bx-user-voice'></i> Médicos</h1>
            <p>Registro y administración del cuerpo médico de la clínica.</p>
        </div>
    </div>

    <div class="card-surface">
        <div class="toolbar">
            <button class="btn btn-primary" id="agregarMedicoBtn" data-bs-toggle="modal" data-bs-target="#modalMedico">
                <i class='bx bx-plus'></i> Registrar médico
            </button>
            <div class="search-input">
                <i class='bx bx-search'></i>
                <input type="search" id="searchMedico" class="form-control" placeholder="Buscar por nombre, documento o correo...">
            </div>
        </div>

        <div class="table-responsive-clinica">
            <table id="medicoTable" class="table table-clinica mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Documento</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Celular</th>
                        <th>Correo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalMedico" tabindex="-1" aria-labelledby="modalMedicoLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalMedicoLabel">Registro de médico</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="medicoForm">
                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="documentType" class="form-label">Tipo de documento</label>
                                <select class="form-select" id="documentType" required>
                                    <option value="Cedula de Ciudadania">C.C</option>
                                    <option value="Pasaporte">P.S</option>
                                    <option value="Cedula Extranjera">C.E</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label for="document" class="form-label">Número de documento</label>
                                <input type="text" class="form-control" id="document" required />
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="firstName" class="form-label">Primer nombre</label>
                                <input type="text" class="form-control" id="firstName" required />
                            </div>
                            <div class="col-sm-6">
                                <label for="secondName" class="form-label">Segundo nombre</label>
                                <input type="text" class="form-control" id="secondName" />
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="firstLastName" class="form-label">Primer apellido</label>
                                <input type="text" class="form-control" id="firstLastName" required />
                            </div>
                            <div class="col-sm-6">
                                <label for="secondLastName" class="form-label">Segundo apellido</label>
                                <input type="text" class="form-control" id="secondLastName" />
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="phoneNumber" class="form-label">Celular</label>
                                <input type="text" class="form-control" id="phoneNumber" required />
                            </div>
                            <div class="col-sm-6">
                                <label for="mail" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="mail" required />
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="status" class="form-label">Estado</label>
                                <select id="status" class="form-select" required>
                                    <option value="false">Habilitado</option>
                                    <option value="true">Deshabilitado</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="guardarMedico">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../Asset/js/Medico.js"></script>
</body>

</html>
